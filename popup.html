<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Tab Equalizer</h1>
        <p id="tabTitle" class="muted">—</p>
      </div>
      <label class="switch" title="Equalize this tab">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <p id="error" class="error" hidden></p>

    <div class="graph">
      <canvas id="graph" width="640" height="240"></canvas>
    </div>

    <div class="toolbar">
      <select id="preset"></select>
      <button id="reset" type="button">Reset</button>
    </div>

    <div class="bands">
      <div class="band preamp">
        <output id="preampValue">0</output>
        <input type="range" id="preamp" min="-18" max="18" step="0.5" value="0" />
        <span class="label">Pre</span>
      </div>
      <div id="bands" class="band-group"></div>
    </div>

    <footer class="muted">Settings apply to every equalized tab.</footer>

    <script src="eq-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
